<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>音乐播放器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, "Microsoft YaHei"}
:root{--kugou-blue:#00a0ff;--bg-main:#17171a;--bg-card:#212127;--text-white:#fff;--text-gray:#999}
body{
  color:var(--text-white);
  background:var(--bg-main);
  background-position:center;
  background-size:cover;
  background-repeat:no-repeat;
  background-attachment:fixed;
  padding-bottom:120px;
  transition: background 0.3s ease;
}
.page{
  display:none;
  padding:20px 16px;
  max-width:560px;
  margin:0 auto;
}
.page.active{display:block;}
.card{
  background:var(--bg-card);
  border-radius:14px;
  padding:18px;
  margin-bottom:16px;
}
.card-title{
  font-size:17px;
  font-weight:500;
  margin-bottom:14px;
}
#fileInput,#bgInput,#coverInput{display:none;}
.btn-row{
  display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;
}
.btn-k{
  flex:1;min-width:110px;padding:12px;border:none;border-radius:10px;color:#fff;font-size:14px;cursor:pointer;
}
.btn-primary{background:var(--kugou-blue)}
.btn-purple{background:#7c4dff}
.btn-teal{background:#00bfa5}
.btn-dark{background:#333}
.btn-fun{background:#ff5782}

.disc-wrap{
  display:flex;justify-content:center;margin:30px 0;
}
.disc{
  width:240px;height:240px;border-radius:50%;background:#000;overflow:hidden;position:relative;
  box-shadow:0 0 30px #00000088;
  border:12px solid #2b2b33;
}
.disc img{width:100%;height:100%;object-fit:cover;}
.disc::before{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:40px;height:40px;background:#17171a;border-radius:50%;z-index:2;
}
.disc.rotate{animation:rotate 14s linear infinite;}
@keyframes rotate{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.disc.pause{animation-play-state:paused;}

.player-info{text-align:center;margin-bottom:24px;}
#songName{font-size:22px;margin-bottom:8px;font-weight:500;}
#songArtist{color:var(--text-gray);font-size:15px;}

.lyric-box{
  background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;height:140px;overflow-y:auto;text-align:center;
  margin-bottom:20px;
}
.lyric-line{padding:5px 0;color:#888;font-size:15px;}
.lyric-line.active{color:var(--kugou-blue);font-size:17px;font-weight:500;}

.progress-wrap{margin-bottom:8px;}
#progress{width:100%;height:4px;appearance:none;background:#333;border-radius:3px;}
#progress::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:50%;background:var(--kugou-blue);}
.time-wrap{display:flex;justify-content:space-between;color:#999;font-size:12px;margin-bottom:22px;}

.control-buttons{display:flex;justify-content:center;gap:32px;align-items:center;margin-bottom:20px;}
.control-btn{background:none;border:none;color:#fff;font-size:32px;cursor:pointer;}
#play{width:72px;height:72px;border-radius:50%;background:var(--kugou-blue);font-size:26px;}
.vol-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
#volume{flex:1;height:4px;appearance:none;background:#333;border-radius:3px;}
#volume::-webkit-slider-thumb{appearance:none;width:12px;height:12px;background:var(--kugou-blue);border-radius:50%;}
.mode-text{text-align:center;color:#aaa;font-size:14px;margin-bottom:16px;}
#changeMode{background:none;border:none;color:var(--kugou-blue);cursor:pointer;}

.playlist-header{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
#togglePlaylist{background:#2c2c34;border:none;color:#fff;padding:5px 10px;border-radius:8px;font-size:13px;cursor:pointer;}
.playlist{background:var(--bg-card);border-radius:14px;max-height:300px;overflow-y:auto;transition:max-height .3s;}
.playlist.collapse{max-height:0;overflow:hidden;}
.playlist-item{
  padding:14px 18px;border-bottom:1px solid #2b2b33;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
}
.playlist-item.active{background:#282830;color:var(--kugou-blue)}
.song-title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:75%;}
.del-song{color:#ff4d4f;font-size:20px;}

.search-input{
  width:100%;padding:14px 16px;border:none;border-radius:12px;background:#25252b;color:#fff;font-size:16px;margin-bottom:16px;outline:none;
}
.search-item{padding:14px 16px;background:var(--bg-card);border-radius:12px;margin-bottom:10px;cursor:pointer;font-size:15px;}

.setting-item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid #2b2b33;}
.setting-item button{background:var(--kugou-blue);border:none;color:#fff;padding:7px 12px;border-radius:8px;cursor:pointer;}

.mini-player{
  position:fixed;left:12px;right:12px;bottom:58px;height:56px;background:#25252d;border-radius:12px;
  display:flex;align-items:center;padding:0 12px;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,0.4);
  z-index:900;cursor:pointer;
}
.mini-cover{width:40px;height:40px;border-radius:8px;object-fit:cover;}
.mini-info{flex:1;}
.mini-name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:12px;color:#999;}
.mini-play-btn{width:40px;height:40px;background:none;border:none;color:#fff;font-size:22px;}

.nav-bar{
  position:fixed;left:0;right:0;bottom:0;height:52px;background:#1f1f26;display:flex;justify-content:space-around;
  align-items:center;z-index:998;
}
.nav-item{text-align:center;color:#888;font-size:12px;cursor:pointer;}
.nav-item.active{color:var(--kugou-blue);}
.nav-item i{font-size:20px;margin-bottom:3px;display:block;}

.login-modal{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:999;
}
.login-box{background:var(--bg-card);border-radius:16px;padding:24px;width:85%;max-width:340px;}
.login-box h3{margin-bottom:16px;text-align:center;}
.login-box input{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;background:#2c2c34;color:#fff;outline:none;}
.login-btn-group{display:flex;gap:10px;margin-top:14px;}
.login-btn-group button{flex:1;padding:12px;border:none;border-radius:10px;color:#fff;cursor:pointer;}
.btn-login{background:var(--kugou-blue)}
.btn-register{background:#7c4dff}
.btn-close{width:100%;margin-top:10px;padding:12px;border:none;border-radius:10px;background:#333;color:#fff;cursor:pointer;}

.announce-modal{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:1000;
}
.announce-box{
  background:#212127;
  border-radius:16px;
  width:88%;
  max-width:400px;
  padding:24px;
}
.announce-box h3{
  color:#00a0ff;
  text-align:center;
  margin-bottom:16px;
}
.announce-content{
  line-height:1.6;
  font-size:15px;
  color:#ddd;
  max-height:300px;
  overflow-y:auto;
  margin-bottom:20px;
}
.announce-close{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#00a0ff;
  color:#fff;
  font-size:16px;
}
</style>
</head>
<body>
<div class="announce-modal" id="announceModal">
  <div class="announce-box">
    <h3>📢 更新公告</h3>
    <div class="announce-content" id="announceText"></div>
    <button class="announce-close" onclick="closeAnnounce()">我知道了</button>
  </div>
</div>

<div class="login-modal" id="loginModal">
  <div class="login-box">
    <h3>账号登录</h3>
    <input type="text" id="username" placeholder="用户名">
    <input type="password" id="pwd" placeholder="密码">
    <div class="login-btn-group">
      <button class="btn-login" onclick="login()">登录</button>
      <button class="btn-register" onclick="register()">注册</button>
    </div>
    <button class="btn-close" onclick="closeLogin()">关闭</button>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple>
<input type="file" id="bgInput" accept="image/*">
<input type="file" id="coverInput" accept="image/*">

<div class="page active" id="page-home">
  <div class="disc-wrap">
    <div class="disc" id="disc">
      <img id="songCover" src="" alt="歌曲封面">
    </div>
  </div>
  <div class="player-info">
    <div id="songName">未选择音乐</div>
    <div id="songArtist">点击设置，加载在线歌单</div>
  </div>
  <div class="lyric-box" id="lyricBox">
    <div class="lyric-line">暂无歌词</div>
  </div>
  <div class="progress-wrap">
    <input type="range" id="progress" min="0" max="100" value="0">
  </div>
  <div class="time-wrap">
    <span id="currentTime">00:00</span>
    <span id="totalTime">00:00</span>
  </div>
  <div class="control-buttons">
    <button class="control-btn" id="prev">⏮</button>
    <button class="control-btn" id="play">▶</button>
    <button class="control-btn" id="next">⏭</button>
  </div>
  <div class="mode-text">播放模式：<span id="modeTxt">列表循环</span>｜<button id="changeMode">切换</button></div>
  <div class="vol-wrap">
    <span>🔊</span>
    <input type="range" id="volume" min="0" max="100" value="80">
  </div>
  <div class="playlist-header">
    <span>播放列表</span>
    <button id="togglePlaylist">收缩</button>
  </div>
  <div class="playlist" id="playlist"></div>
</div>

<div class="page" id="page-search">
  <input class="search-input" id="searchInput" placeholder="搜索歌曲" oninput="searchSong()">
  <div id="searchResult"></div>
</div>

<div class="page" id="page-my">
  <div class="card">
    <div class="card-title">个人中心</div>
    <div id="userInfo">未登录</div>
    <button style="margin-top:12px;width:100%;padding:12px;background:var(--kugou-blue);border:none;border-radius:10px;color:#fff;" onclick="showLogin()">登录账号</button>
  </div>
  <div class="card">
    <div class="card-title">歌单统计</div>
    <div id="listStat">歌曲数量：0</div>
    <div style="margin-top:8px;color:#aaa;" id="playTimerStat">本次播放时长：00:00</div>
  </div>
</div>

<div class="page" id="page-setting">
  <div class="card">
    <div class="card-title">媒体管理</div>
    <div class="btn-row">
      <button class="btn-k btn-primary" onclick="document.getElementById('fileInput').click()">➕ 添加本地音乐</button>
      <button class="btn-k btn-purple" onclick="document.getElementById('bgInput').click()">🖼️ 导入背景</button>
      <button class="btn-k btn-teal" onclick="document.getElementById('coverInput').click()">📷 设置歌曲封面</button>
      <button class="btn-k btn-dark" onclick="clearBg()">还原背景</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">趣味工具</div>
    <div class="btn-row">
      <button class="btn-k btn-fun" onclick="randomPlaySong()">🎲 随机播放</button>
      <button class="btn-k btn-fun" onclick="randomThemeColor()">🎨 更换主色</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">系统设置</div>
    <div class="setting-item">
      <span>重置全部本地数据</span>
      <button onclick="resetAllData()">重置</button>
    </div>
    <div class="setting-item">
      <span>清空本地歌单</span>
      <button onclick="clearAllList()">清空</button>
    </div>
    <div class="setting-item">
      <span>【开发者】刷新在线歌单</span>
      <button onclick="fetchOnlineSongList()">刷新</button>
    </div>
  </div>
</div>

<div class="mini-player" id="miniPlayer" onclick="switchPage('page-home')">
  <img class="mini-cover" id="miniCover" src="">
  <div class="mini-info">
    <div class="mini-name" id="miniName">暂无歌曲</div>
    <div class="mini-artist">在线音乐</div>
  </div>
  <button class="mini-play-btn" id="miniPlayBtn" onclick="miniPlayToggle(event)">▶</button>
</div>

<div class="nav-bar">
  <div class="nav-item active" onclick="switchPage('page-home')">
    <i>🎵</i>主页
  </div>
  <div class="nav-item" onclick="switchPage('page-search')">
    <i>🔍</i>搜索
  </div>
  <div class="nav-item" onclick="switchPage('page-my')">
    <i>👤</i>我的
  </div>
  <div class="nav-item" onclick="switchPage('page-setting')">
    <i>⚙️</i>设置
  </div>
</div>

<audio id="audio">
<script>
const audio = document.getElementById('audio');
const fileInput = document.getElementById('fileInput');
const bgInput = document.getElementById('bgInput');
const coverInput = document.getElementById('coverInput');
const playBtn = document.getElementById('play');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const progress = document.getElementById('progress');
const volume = document.getElementById('volume');
const currentTimeEl = document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const songNameEl = document.getElementById('songName');
const songArtistEl = document.getElementById('songArtist');
const playlistEl = document.getElementById('playlist');
const modeTxt = document.getElementById('modeTxt');
const changeModeBtn = document.getElementById('changeMode');
const discEl = document.getElementById('disc');
const songCoverEl = document.getElementById('songCover');
const togglePlaylistBtn = document.getElementById('togglePlaylist');
const lyricBox = document.getElementById('lyricBox');
const searchInput = document.getElementById('searchInput');
const searchResultEl = document.getElementById('searchResult');
const playTimerStat = document.getElementById('playTimerStat');
const miniPlayer = document.getElementById('miniPlayer');
const miniCover = document.getElementById('miniCover');
const miniName = document.getElementById('miniName');
const miniPlayBtn = document.getElementById('miniPlayBtn');
const announceModal = document.getElementById('announceModal');
const announceText = document.getElementById('announceText');

let playMode = 0;
const modeName = ["列表循环","单曲循环","随机播放"];
let songList = [];
let currentIndex = 0;
let isPlaylistCollapse = false;
let playTotalSecond = 0;
let playTimer;

// ========= 【重要！修改这里！】你的 songlist.json 在线地址 =========
const jsonUrl = "https://你的域名/songlist.json";
// ================================================================

function showAnnounce(text){
  announceText.innerText = text;
  announceModal.style.display = 'flex';
}
function closeAnnounce(){
  announceModal.style.display = 'none';
  localStorage.setItem("player_version", window.playerVersion);
}
async function checkVersionAnnounce(){
  try{
    const res = await fetch(jsonUrl);
    const cfg = await res.json();
    window.playerVersion = cfg.version;
    window.playerAnnouncement = cfg.announcement;
    const oldVer = localStorage.getItem("player_version");
    if(oldVer !== window.playerVersion){
      showAnnounce(window.playerAnnouncement);
    }
  }catch(e){
    console.log("无法读取版本公告");
  }
}

async function fetchOnlineSongList(){
  try{
    const resp = await fetch(jsonUrl);
    const data = await resp.json();
    const onlineSongs = data.songs;
    onlineSongs.forEach(song=>{
      songList.push({
        name:song.name,
        url:song.url,
        cover:song.cover||"",
        lyric:song.lyric||[]
      })
    })
    saveListToLocal();
    renderPlaylist();
    alert("✅ 在线歌单加载成功！");
  }catch(err){
    alert("❌ 读取歌单失败！检查json链接是否正确、跨域问题");
    console.error(err);
  }
}

function switchPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.onclick.toString().includes(id));
  })
}
function miniPlayToggle(e){
  e.stopPropagation();
  if(songList.length===0) return;
  if(audio.paused){audio.play();}else{audio.pause();}
}
togglePlaylistBtn.onclick = ()=>{
  isPlaylistCollapse = !isPlaylistCollapse;
  playlistEl.classList.toggle('collapse', isPlaylistCollapse);
  togglePlaylistBtn.innerText = isPlaylistCollapse ? "展开" : "收缩";
}
bgInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    const dataUrl = ev.target.result;
    document.body.style.backgroundImage = `url("${dataUrl}")`;
    localStorage.setItem("playerBg", dataUrl);
  };
  reader.readAsDataURL(file);
};
function loadBg(){
  const savedBg = localStorage.getItem("playerBg");
  if(savedBg){
    document.body.style.backgroundImage = `url("${savedBg}")`;
  }
}
function clearBg(){
  document.body.style.backgroundImage = "";
  localStorage.removeItem("playerBg");
  bgInput.value = "";
}
coverInput.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const currentSongCover = ev.target.result;
    songCoverEl.src = currentSongCover;
    miniCover.src = currentSongCover;
    if(songList.length>0){
      songList[currentIndex].cover = currentSongCover;
      saveListToLocal();
    }
  }
  reader.readAsDataURL(file);
}
function searchSong(){
  const keyword = searchInput.value.trim().toLowerCase();
  searchResultEl.innerHTML = "";
  if(!keyword) return;
  const result = songList.filter((s)=>s.name.toLowerCase().includes(keyword));
  result.forEach((song)=>{
    const realIdx = songList.indexOf(song);
    const div = document.createElement("div");
    div.className="search-item";
    div.innerText = song.name;
    div.onclick = ()=>{
      playSong(realIdx);
      switchPage("page-home");
    }
    searchResultEl.appendChild(div);
  })
  if(result.length===0) searchResultEl.innerHTML = `<div style="padding:12px;color:#aaa">没有找到歌曲</div>`;
}
function randomPlaySong(){
  if(songList.length===0){alert("歌单为空，请先添加音乐");return;}
  const rndIdx = Math.floor(Math.random() * songList.length);
  playSong(rndIdx);
  switchPage("page-home");
}
function randomThemeColor(){
  const arr = ['#00a0ff','#39adff','#2299ff','#1888ee'];
  const c = arr[Math.floor(Math.random()*arr.length)];
  document.documentElement.style.setProperty('--kugou-blue',c);
  localStorage.setItem("themeColor",c);
}
function loadThemeColor(){
  const c = localStorage.getItem("themeColor");
  if(c) document.documentElement.style.setProperty('--kugou-blue',c);
}
function startPlayTimer(){
  clearInterval(playTimer);
  playTimer = setInterval(()=>{
    playTotalSecond++;
    playTimerStat.innerText = `本次播放时长：${formatTime(playTotalSecond)}`;
  },1000)
}
function stopPlayTimer(){
  clearInterval(playTimer);
}
function showLogin(){document.getElementById('loginModal').style.display='flex';}
function closeLogin(){document.getElementById('loginModal').style.display='none';}
function getUsers(){const str = localStorage.getItem("userList");return str ? JSON.parse(str) : {};}
function saveUsers(obj){localStorage.setItem("userList",JSON.stringify(obj));}
function register(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('pwd').value.trim();
  if(!u||!p){alert("用户名密码不能为空");return;}
  const users = getUsers();
  if(users[u]){alert("账号已存在");return;}
  users[u]=p;saveUsers(users);alert("注册成功，请登录");
}
function login(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('pwd').value.trim();
  const users = getUsers();
  if(users[u]===p){
    localStorage.setItem("loginUser",u);updateUserInfo();closeLogin();alert("登录成功");
  }else{alert("账号密码错误");}
}
function updateUserInfo(){
  const loginUser = localStorage.getItem("loginUser");
  const dom = document.getElementById('userInfo');
  dom.innerText = loginUser ? "当前用户："+loginUser : "未登录";
}
function loadLocalList(){
  const saveData = localStorage.getItem("musicList");
  if(!saveData) return;
  const data = JSON.parse(saveData);
  songList = data;
  renderPlaylist();
  document.getElementById('listStat').innerText = "歌曲数量："+songList.length;
}
function saveListToLocal(){
  localStorage.setItem("musicList", JSON.stringify(songList));
  document.getElementById('listStat').innerText = "歌曲数量："+songList.length;
}
function formatTime(s){
  if(isNaN(s)) return "00:00";
  let m = Math.floor(s/60);let sec = Math.floor(s%60);
  return `${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
}
function renderPlaylist(){
  playlistEl.innerHTML = '';
  songList.forEach((song,idx)=>{
    const item = document.createElement('div');
    item.className = `playlist-item ${idx===currentIndex ? 'active':''}`;
    item.innerHTML = `<div class="song-title" title="${song.name}">${song.name}</div><span class="del-song" data-idx="${idx}">✕</span>`;
    item.onclick = (e)=>{if(!e.target.classList.contains('del-song')) playSong(idx);}
    playlistEl.appendChild(item);
  })
  document.querySelectorAll('.del-song').forEach(el=>{
    el.onclick = (e)=>{
      const idx = Number(e.target.dataset.idx);
      songList.splice(idx,1);
      if(currentIndex >= songList.length) currentIndex = songList.length -1;
      saveListToLocal();renderPlaylist();
    }
  })
}
fileInput.onchange = function(e){
  const files = e.target.files;
  if(!files.length) return;
  for(let f of files){
    const url = URL.createObjectURL(f);
    songList.push({name:f.name, url:url, cover:"", lyric:[]});
  }
  saveListToLocal();renderPlaylist();
  if(songList.length >0 && audio.paused){
    playSong(songList.length - files.length);
  }
}
function playSong(index){
  if(songList.length ===0) return;
  currentIndex = index;
  const song = songList[currentIndex];
  audio.src = song.url;
  audio.play();
  songNameEl.innerText = song.name;
  songArtistEl.innerText = "在线音乐";
  playBtn.innerText = "⏸";
  miniPlayBtn.innerText = "⏸";
  discEl.classList.add("rotate");
  songCoverEl.src = song.cover || "";
  miniCover.src = song.cover || "";
  miniName.innerText = song.name;
  lyricBox.innerHTML = `<div class="lyric-line">暂无歌词</div>`;
  renderPlaylist();
  startPlayTimer();
}
playBtn.onclick = ()=>{
  if(songList.length===0) return;
  if(audio.paused){
    audio.play();playBtn.innerText = "⏸";miniPlayBtn.innerText="⏸";discEl.classList.add("rotate");startPlayTimer();
  }else{
    audio.pause();playBtn.innerText = "▶";miniPlayBtn.innerText="▶";discEl.classList.remove("rotate");stopPlayTimer();
  }
}
prevBtn.onclick = ()=>{
  if(songList.length===0) return;
  if(playMode===2) currentIndex = Math.floor(Math.random()*songList.length);
  else currentIndex = (currentIndex -1 + songList.length) % songList.length;
  playSong(currentIndex);
}
function nextSong(){
  if(songList.length===0) return;
  if(playMode===1){audio.currentTime = 0;audio.play();}
  else if(playMode===2){currentIndex = Math.floor(Math.random()*songList.length);playSong(currentIndex);}
  else{currentIndex = (currentIndex +1) % songList.length;playSong(currentIndex);}
}
nextBtn.onclick = nextSong;
audio.ontimeupdate = ()=>{
  const p = (audio.currentTime / audio.duration)*100 || 0;
  progress.value = p;
  currentTimeEl.innerText = formatTime(audio.currentTime);
}
audio.onloadedmetadata = ()=>{totalTimeEl.innerText = formatTime(audio.duration);}
progress.oninput = ()=>{audio.currentTime = (progress.value /100) * audio.duration;}
volume.oninput = ()=>{audio.volume = volume.value / 100;}
audio.volume = 0.8;
audio.onended = nextSong;
changeModeBtn.onclick = ()=>{
  playMode = (playMode+1)%3;modeTxt.innerText = modeName[playMode];
}
function clearAllList(){
  songList = [];audio.pause();audio.src="";
  songNameEl.innerText = "未选择音乐";songArtistEl.innerText = "点击设置，加载在线歌单";
  playBtn.innerText = "▶";miniPlayBtn.innerText="▶";miniName.innerText="暂无歌曲";
  discEl.classList.remove("rotate");songCoverEl.src="";miniCover.src="";
  localStorage.removeItem("musicList");renderPlaylist();
}
function resetAllData(){localStorage.clear();location.reload();}
window.onload = async ()=>{
  loadBg();loadThemeColor();loadLocalList();updateUserInfo();
  await checkVersionAnnounce();
}
</script>
</body>
